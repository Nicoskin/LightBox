# Every push and pull request: formatting, clippy, tests on generated
# samples, release build of the viewer and of the installer that embeds it.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # libjpeg-turbo's SIMD (turbojpeg "require-simd") is assembled by NASM.
      - uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            installer -> ../target/setup

      - name: Format
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --check --manifest-path installer/Cargo.toml

      - name: Clippy
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings

      # The full set is ~600 MB, almost all of it the 30000×20000 PNG that
      # only an #[ignore]d test reads. gen_testdata skips that file when it
      # exists, so an empty placeholder keeps the set to ~40 MB.
      - name: Generate test samples
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force testdata | Out-Null
          New-Item -ItemType File -Force testdata/huge_30000x20000.png | Out-Null
          cargo run --release --locked --example gen_testdata

      - name: Test
        run: cargo test --release --workspace --locked

      - name: Build viewer and thumbnail handler
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --profile shellext -p lightbox-thumbs --locked

      - name: Build installer
        shell: pwsh
        run: |
          $env:LIGHTBOX_EXE = "$PWD\target\release\lightbox.exe"
          $env:LIGHTBOX_THUMBS_DLL = "$PWD\target\shellext\lightbox_thumbs.dll"
          $env:LIGHTBOX_VERSION = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          cargo clippy --release --locked --manifest-path installer/Cargo.toml --target-dir target/setup -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --manifest-path installer/Cargo.toml --target-dir target/setup

      - uses: actions/upload-artifact@v7
        with:
          name: lightbox-${{ github.sha }}
          path: |
            target/release/lightbox.exe
            target/setup/release/lightbox-setup.exe
          retention-days: 7
