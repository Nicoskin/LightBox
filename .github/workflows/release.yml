# A pushed tag v* builds a release and saves it as a draft GitHub release
# with lightbox-setup-<version>.exe, its .sha256 and
# lightbox-portable-<version>.zip (see docs/SIGNING.md).
#
# Same steps as tools/release.ps1 (keep the two in sync), plus code signing
# through SignPath in between: lightbox.exe is signed before the installer
# embeds it, then the installer itself is signed. Without the SignPath
# secret and variables the release is built unsigned, with a warning.
#
# Tags with a "-" (v0.3.0-rc1) are pre-releases: signed with the test
# signing policy and allowed not to match the version in Cargo.toml.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release
  actions: read # SignPath downloads the unsigned artifacts with this token

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The repository whose releases the viewer checks for updates.
  LIGHTBOX_UPDATE_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/setup-nasm@v1

      # No build cache here: a signed release is built from scratch.

      - name: Version
        id: version
        shell: pwsh
        env:
          RELEASE_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          TEST_POLICY: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG || 'test-signing' }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          $pre = $tag.Contains('-')
          if ($tag -ne "v$version") {
            if (-not $pre) {
              Write-Output "::error::Tag $tag does not match the version in Cargo.toml ($version)"
              exit 1
            }
            Write-Output "::warning::Pre-release tag $tag, Cargo.toml says ${version}, building ${version}"
          }
          $policy = if ($pre) { $env:TEST_POLICY } else { $env:RELEASE_POLICY }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "policy=$policy" >> $env:GITHUB_OUTPUT

      - name: SignPath not configured
        if: env.SIGNPATH_ENABLED != 'true'
        run: >-
          Write-Output "::warning title=Unsigned release::SIGNPATH_API_TOKEN
          (secret) or SIGNPATH_ORGANIZATION_ID (variable) is not set, so this
          release is NOT signed. See docs/SIGNING.md."

      - name: Build viewer and thumbnail handler
        run: |
          cargo build --release --locked --target-dir target/dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --profile shellext -p lightbox-thumbs --locked --target-dir target/dist

      # --- lightbox.exe and lightbox_thumbs.dll -> SignPath ----------------

      - name: Stage unsigned binaries
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item target/dist/release/lightbox.exe, target/dist/shellext/lightbox_thumbs.dll unsigned/

      - name: Upload unsigned lightbox.exe
        id: unsigned-exe
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-lightbox-exe
          path: unsigned/
          if-no-files-found: error
          retention-days: 7

      - name: Sign lightbox.exe
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || github.event.repository.name }}
          signing-policy-slug: ${{ steps.version.outputs.policy }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing waits for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/exe

      - name: Use signed lightbox.exe
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/exe/lightbox.exe
          if (-not $sig.SignerCertificate) { throw "signed/exe/lightbox.exe has no signature" }
          Write-Output "lightbox.exe: $($sig.Status), $($sig.SignerCertificate.Subject)"
          Copy-Item signed/exe/lightbox.exe target/dist/release/lightbox.exe -Force
          $dll = Get-AuthenticodeSignature signed/exe/lightbox_thumbs.dll
          if (-not $dll.SignerCertificate) { throw "signed/exe/lightbox_thumbs.dll has no signature" }
          Copy-Item signed/exe/lightbox_thumbs.dll target/dist/shellext/lightbox_thumbs.dll -Force

      # --- installer embedding it -----------------------------------------

      - name: Build installer
        shell: pwsh
        env:
          LIGHTBOX_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $env:LIGHTBOX_EXE = "$PWD\target\dist\release\lightbox.exe"
          $env:LIGHTBOX_THUMBS_DLL = "$PWD\target\dist\shellext\lightbox_thumbs.dll"
          cargo build --release --locked --manifest-path installer/Cargo.toml --target-dir target/dist-setup
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/dist-setup/release/lightbox-setup.exe dist/lightbox-setup.exe -Force

      # The portable version: the (signed) viewer and its marker file, as in
      # tools/release.ps1.
      - name: Portable zip
        shell: pwsh
        env:
          LIGHTBOX_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $stage = "target/dist-portable/Lightbox"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/dist/release/lightbox.exe $stage
          Set-Content -Path "$stage/portable.txt" -Encoding utf8 -Value @"
          Lightbox $env:LIGHTBOX_VERSION, портативная версия. Настройки и кэш хранятся
          в папке data рядом с lightbox.exe. Удалите этот файл, чтобы Lightbox
          работал как установленный.

          Lightbox $env:LIGHTBOX_VERSION, portable. Settings and caches live in the data
          folder next to lightbox.exe. Delete this file to make Lightbox use the
          normal locations.
          "@
          Compress-Archive -Path $stage -DestinationPath dist/lightbox-portable.zip -Force

      - name: Upload unsigned installer
        id: unsigned-setup
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-lightbox-setup
          path: dist/lightbox-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || github.event.repository.name }}
          signing-policy-slug: ${{ steps.version.outputs.policy }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/setup

      - name: Use signed installer
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/setup/lightbox-setup.exe
          if (-not $sig.SignerCertificate) { throw "signed/setup/lightbox-setup.exe has no signature" }
          Write-Output "lightbox-setup.exe: $($sig.Status), $($sig.SignerCertificate.Subject)"
          Copy-Item signed/setup/lightbox-setup.exe dist/lightbox-setup.exe -Force

      # --- checksum and the draft release ---------------------------------

      # Download names carry the version; the checksum is in the format the
      # updater (src/update.rs) and release.ps1 use.
      - name: Versioned names and SHA-256
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "lightbox-setup-$env:VERSION.exe"
          Move-Item dist/lightbox-setup.exe "dist/$setup" -Force
          Move-Item dist/lightbox-portable.zip "dist/lightbox-portable-$env:VERSION.zip" -Force
          $hash = (Get-FileHash "dist/$setup" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$setup.sha256" -Value "$hash  $setup" -NoNewline -Encoding ascii
          Write-Output "sha256 $hash"

      - uses: actions/upload-artifact@v7
        with:
          name: lightbox-setup-${{ github.ref_name }}
          path: dist/
          retention-days: 30

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $v = $env:VERSION
          $files = "dist/lightbox-setup-$v.exe", "dist/lightbox-setup-$v.exe.sha256", "dist/lightbox-portable-$v.zip"
          $draft = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            # A re-run: replace the files, but never in a published release.
            if ($draft -ne 'true') {
              Write-Output "::error::Release $tag is already published; delete it or use a new tag"
              exit 1
            }
            gh release upload $tag @files --clobber
          } else {
            $flags = "--draft", "--verify-tag", "--generate-notes", "--title", "Lightbox $env:VERSION"
            if ($env:PRERELEASE -eq 'true') { $flags += "--prerelease" }
            gh release create $tag @files @flags
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Write-Output "Draft release: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases (publish it there)"
