[package]
name = "lightbox-thumbs"
version = "0.3.1"
edition = "2024"
description = "Explorer thumbnails for 3D models (STL, OBJ, 3MF), a COM thumbnail handler"
license = "MIT"
publish = false

[lib]
name = "lightbox_thumbs"
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "qoi"] }
serde_json = "1.0.154"
miniz_oxide = "0.8.9"
png = "0.18.1"
roxmltree = "0.21.1"
windows-core = "0.62.2"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
]

[dev-dependencies]
# The viewer's 3MF tests build ZIPs with CRCs.
crc32fast = "1.5.2"
